name: Bug report
description: Report a crash or something that does not work.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Pack version
      placeholder: "26.10.17"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you were doing and what went wrong.
    validations:
      required: true
  - type: input
    id: log
    attributes:
      label: Log link
      description: Upload your crash report or latest.log to https://mclo.gs
        and paste the link.
